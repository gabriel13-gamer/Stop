name: Build STOP Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stop_android/**"
      - "supabase/**"
      - ".github/workflows/stop-android.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: stop_android
        run: flutter create . --platforms=android --org com.gabriel --project-name stop
      - name: Configure Android manifest
        working-directory: stop_android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          permissions="""    <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
          """
          if "android.permission.BLUETOOTH_SCAN" not in s:
              s=s.replace("<application",permissions+"\n    <application",1)
          filters="""<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="stop" android:host="join"/></intent-filter><intent-filter android:autoVerify="true"><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="https" android:host="gabriel13-gamer.github.io" android:pathPrefix="/Stop/join"/></intent-filter>"""
          if 'android:scheme="stop"' not in s:
              s=s.replace("</activity>",filters+"</activity>",1)
          p.write_text(s)
          PY
      - name: Get dependencies
        working-directory: stop_android
        run: flutter pub get
      - name: Analyze
        working-directory: stop_android
        run: flutter analyze
      - name: Test
        working-directory: stop_android
        run: flutter test
      - name: Build release APK
        working-directory: stop_android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk STOP.apk
      - name: Upload STOP.apk
        uses: actions/upload-artifact@v4
        with:
          name: STOP-APK
          path: stop_android/STOP.apk
          retention-days: 30
