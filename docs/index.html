body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 15% 20%,#e52d3210,transparent 28%),radial-gradient(circle at 85% 70%,#ffffff06,transparent 25%);animation:bgDrift 12s ease-in-out infinite alternate}

<script>

};

function sound(type){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();const q={click:[520,.06],stop:[180,.18],win:[660,.12],tick:[900,.035],join:[420,.1],error:[120,.16]}[type]||[500,.06];o.frequency.value=q[0];o.type=type==="stop"?"sawtooth":"sine";g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+q[1]);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+q[1]+.02)}catch(e){}}

function header(){return '<header class="top"><div class="brand">'+mark()+'<div><strong>STOP</strong><small>Joga. Pensa. Para!</small></div></div><button class="iconbtn" onclick="toggleTheme()" aria-label="Alternar tema">☀</button></header>'}

function toggleTheme(){state.theme=state.theme==="dark"?"light":"dark";document.documentElement.style.setProperty("--bg",state.theme==="dark"?"#0b0c0f":"#f2f1ed");document.body.style.background=state.theme==="dark"?"radial-gradient(circle at 50% -10%,#262a34 0,#0b0c0f 38%)":"#f2f1ed";document.body.style.color=state.theme==="dark"?"#f5f5f2":"#151515";toast(state.theme==="dark"?"Modo escuro":"Modo claro");save()}
function home(){return shell('<section class="hero"><span class="tag">PARTIDAS RÁPIDAS • STOP ONLINE READY</span>'+mark()+'<h1>STOP</h1><p>Joga. Pensa. Para!</p></section><div class="grid"><button class="action primary" onclick="go(\'create\')"><div class="big">Criar partida</div><p>Escolhe categorias, letras, tempo e rondas.</p></button><button class="action" onclick="join()"><div class="big">Entrar numa partida</div><p>Usa um código de sala para jogar com amigos.</p></button><div class="grid grid2"><button class="action" onclick="go(\'profile\')"><div class="big" style="font-size:20px">Perfil</div><p>Estatísticas e histórico.</p></button><button class="action" onclick="go(\'rank\')"><div class="big" style="font-size:20px">Ranking</div><p>Compara pontuações.</p></button></div></div>')}
function create(){return shell('<div class="create-head"><button class="backbtn" onclick="go(\\'home\\')">←</button><div><p class="section-title">NOVA PARTIDA</p><h2>Criar partida</h2><p>Configura o jogo antes de convidares os teus amigos.</p></div></div><div class="create-layout"><div class="setup-card hero-setup"><div class="setup-icon">✦</div><div><span class="setup-kicker">A TUA SALA</span><h3>Vamos começar?</h3><p>Escolhe as regras e depois partilha o código da sala.</p></div></div><div class="setup-card"><div class="setup-title"><span>👥</span><div><b>Jogadores</b><small>Sem bots — apenas pessoas reais</small></div></div><div class="player-limit"><button onclick="changePlayers(-1)">−</button><strong id="playerCount">2</strong><span>de</span><strong>8</strong><button onclick="changePlayers(1)">+</button></div></div><div class="setup-card"><div class="setup-title"><span>⏱</span><div><b>Tempo por ronda</b><small>O tempo começa para todos ao mesmo tempo</small></div></div><div class="time-grid">'+[15,30,45,60,90,120].map(n=>'<button class="time-option '+(state.seconds===n?'selected':'')+'" onclick="state.seconds='+n+';save();render()"><strong>'+n+'</strong><small>seg</small></button>').join('')+'</div></div><div class="setup-card"><div class="setup-title"><span>🔤</span><div><b>Letras</b><small>Seleciona as letras permitidas</small></div></div><div class="letters bigletters">'+ALPHA.map(l=>'<button class="letter '+(state.letters.includes(l)?'on':'')+'" onclick="toggleLetter(\\''+l+'\\')">'+l+'</button>').join('')+'</div><div class="mini-actions"><button onclick="state.letters=ALPHA.slice();save();render()">Selecionar todas</button><button onclick="state.letters=[];save();render()">Limpar</button></div></div><div class="setup-card"><div class="setup-title"><span>☷</span><div><b>Categorias personalizadas</b><small>Escolhe 8+ categorias — cria as tuas próprias</small></div><strong class="count-pill">'+state.cats.length+'/8+</strong></div><div class="chips category-chips">'+allCats().map(c=>'<button class="chip '+(state.cats.includes(c)?'on':'')+'" onclick="toggleCat(\\''+esc(c)+'\\')">'+esc(c)+'</button>').join('')+'</div><div class="custom-row"><input class="input" id="customCat" placeholder="Adicionar categoria personalizada"><button class="btn small" onclick="addCustomCat()">✦ Criar</button></div></div><div class="setup-card"><div class="setup-title"><span>🔁</span><div><b>Rondas</b><small>Quantas rondas queres jogar?</small></div></div><div class="round-picker"><button onclick="changeRounds(-1)">−</button><strong id="roundCount">'+state.rounds+'</strong><span>rondas</span><button onclick="changeRounds(1)">+</button></div></div><button class="start-create" onclick="makeRoom()"><span>Criar sala</span><b>→</b></button></div>',"play")}
function changePlayers(d){state.maxPlayers=Math.max(2,Math.min(8,(state.maxPlayers||2)+d));save();render()}
function changeRounds(d){state.rounds=Math.max(1,Math.min(20,(state.rounds||5)+d));save();render()}
function toggleLetter(l){state.letters=state.letters.includes(l)?state.letters.filter(x=>x!==l):[...state.letters,l];save();render()}
function toggleCat(c){sound("click");state.cats=state.cats.includes(c)?state.cats.filter(x=>x!==c):[...state.cats,c];save();render()}
function addCustomCat(){const el=document.getElementById("customCat");const c=(el?.value||"").trim();if(!c)return toast("Escreve o nome da categoria");if(c.length>30)return toast("Categoria demasiado longa");if(allCats().some(x=>x.toLowerCase()===c.toLowerCase()))return toast("Essa categoria já existe");state.customCats=[...(state.customCats||[]),c];state.cats.push(c);save();sound("click");render()}
function makeRoom(){sound("join");const r=Math.random().toString(36).slice(2,8).toUpperCase();state.rounds=Math.max(1,Math.min(20,state.rounds||5));if(state.cats.length<8)return toast("Escolhe pelo menos 8 categorias");if(!state.letters.length)return toast("Escolhe pelo menos uma letra");state.room=r;state.maxPlayers=state.maxPlayers||2;state.screen="lobby";save();render()}
function lobby(){return shell('<div class="card" style="text-align:center;padding:28px"><p class="section-title">SALA</p><h1 style="font-size:52px;letter-spacing:.08em;margin:5px 0 10px">'+state.room+'</h1><p class="muted">Entra por código ou usa o link direto.</p><div class="tag" style="margin-top:8px">SEM BOTS · JOGADORES REAIS</div><div class="grid grid2" style="margin-top:18px"><button class="btn" onclick="navigator.clipboard?.writeText(state.room);sound(\'click\');toast(\'Código copiado\')">Copiar código</button><button class="btn" onclick="shareRoom()">🔗 Copiar link</button></div><button class="btn primary" style="margin-top:10px" onclick="shareRoom()">Partilhar sala</button></div><div class="card" style="margin-top:12px"><div class="row"><b>Jogadores</b><span class="badge ok">● 1 online</span></div><div style="margin-top:14px;display:grid;gap:10px"><div class="row"><span>👤 '+esc(state.user.name)+'</span><span class="tiny">HOST</span></div></div></div><button class="btn primary" style="margin-top:12px" onclick="startRound()">COMEÇAR PARTIDA</button><button class="btn ghost" style="margin-top:6px" onclick="go(\'home\')">Sair da sala</button>','play')}
function shareRoom(){const url=location.origin+location.pathname+"?room="+encodeURIComponent(state.room);sound("join");if(navigator.share)navigator.share({title:"STOP",text:"Entra na minha partida de STOP!",url}).catch(()=>{});else{navigator.clipboard?.writeText(url);toast("Link da sala copiado")}}
function startRound(){sound("click");state.round=1;state.letter=state.letters[Math.floor(Math.random()*state.letters.length)];state.answers={};state.screen="game";save();render();startTimer()}
let timer=null,endAt=0;
function startTimer(){clearInterval(timer);endAt=Date.now()+state.seconds*1000;timer=setInterval(()=>{if(Date.now()>=endAt){clearInterval(timer);sound("stop");finishRound(true)}else{const el=document.getElementById("timer");if(el){const left=Math.ceil((endAt-Date.now())/1000);el.textContent=left;el.classList.toggle("danger",left<=10)}}},250)}
function game(){const fields=state.cats.map((c,i)=>'<div class="answer" style="animation-delay:'+Math.min(i*.035,.5)+'s"><label>'+c+'</label><input class="input" data-cat="'+esc(c)+'" value="'+esc(state.answers[c]||"")+'" placeholder="Resposta..."></div>').join("");return shell('<div class="row"><div><p class="section-title">RONDA '+state.round+'/'+state.rounds+'</p><div id="timer" class="timer">'+state.seconds+'</div></div><div class="roundletter">'+state.letter+'</div></div><div class="card" style="margin-top:18px"><div class="row"><b>As tuas respostas</b><span class="tiny">'+state.cats.length+' categorias</span></div>'+fields+'</div><button class="btn primary game-stop" style="margin-top:12px;font-size:18px;padding:19px" onclick="finishRound(false)">🛑 STOP!</button><p class="tiny" style="text-align:center;margin-top:10px">Qualquer jogador pode terminar a ronda.</p>',"play")}
function finishRound(auto){document.querySelectorAll("[data-cat]").forEach(i=>state.answers[i.dataset.cat]=i.value.trim());const vals=state.cats.map(c=>(state.answers[c]||"").trim());const valid=vals.filter(a=>a.length>0&&a.toUpperCase().startsWith(state.letter)).length;if(!auto&&valid<1){sound("error");toast("Ainda não podes fazer STOP");const g=document.querySelector(".card");if(g){g.classList.remove("shake");void g.offsetWidth;g.classList.add("shake")}return}sound("stop");clearInterval(timer);state.screen="verify";state.auto=auto;save();render()}
function verify(){const rows=state.cats.map((c,i)=>{const a=state.answers[c]||"";const good=a.toUpperCase().startsWith(state.letter)&&a.length>0;return '<div class="verify" style="animation-delay:'+Math.min(i*.045,.6)+'s"><div><b>'+c+'</b><div class="tiny">'+(a?esc(a):"Sem resposta")+'</div></div><span class="badge '+(good?"ok":"bad")+'">'+(good?"✓ +10":"✕ 0")+'</span></div>'}).join("");return shell('<div class="card"><p class="section-title">VERIFICAÇÃO</p><h2 style="font-size:30px;margin:0 0 8px">Respostas da ronda</h2><p class="muted">'+(state.auto?"⏱️ Tempo esgotado — STOP automático.":"🛑 STOP feito manualmente.")+'</p>'+rows+'</div><button class="btn primary" style="margin-top:12px" onclick="result()">Ver resultado</button>',"play")}
function result(){sound("win");let score=state.cats.reduce((n,c)=>n+((state.answers[c]||"").toUpperCase().startsWith(state.letter)?10:0),0);state.user.points+=score;state.user.games++;if(state.round===state.rounds)state.user.wins++;state.history.unshift({date:new Date().toLocaleDateString("pt-PT"),round:state.round,score,letter:state.letter});state.history=state.history.slice(0,20);save();state.screen="result";state.lastScore=score;render()}
function resultScreen(){return shell('<div class="card" style="text-align:center"><div style="font-size:42px">🏆</div><p class="section-title">RONDA TERMINADA</p><h1 style="font-size:40px;margin:0">+'+state.lastScore+' pontos</h1><p class="muted">Letra: <b>'+state.letter+'</b></p></div><div class="card" style="margin-top:14px;text-align:center">
  <div style="font-size:34px">🎉</div>
  <h2 style="margin:8px 0 4px">A tua ronda terminou</h2>
  <p class="muted">Pontuação desta ronda</p>
  <div style="font-size:48px;font-weight:950;color:var(--red)">+'+state.lastScore+' pts</div>
</div><button class="btn primary" style="margin-top:14px" onclick="nextRound()">'+(state.round<state.rounds?"Próxima ronda":"🏆 Resultado final")+'</button>',"play")}
function nextRound(){if(state.round>=state.rounds){go("home");toast("Partida terminada!");return}state.round++;state.letter=state.letters[Math.floor(Math.random()*state.letters.length)];state.answers={};state.screen="game";save();render();startTimer()}
function join(){const code=prompt("Código da sala:");if(code){sound("join");state.room=code.trim().toUpperCase();state.screen="lobby";save();render()}}
function joinFromUrl(){const p=new URLSearchParams(location.search),h=location.hash,code=p.get("room")||(h.startsWith("#join=")?h.slice(6):"");if(code){state.room=decodeURIComponent(code).toUpperCase();state.screen="lobby";save();history.replaceState(null,"",location.pathname);return true}return false}
function profile(){return shell('<div class="card"><p class="section-title">PERFIL</p><div class="row"><div><h2 style="margin:0;font-size:30px">'+esc(state.user.name)+'</h2><p class="muted">Jogador STOP</p></div><div style="font-size:44px">👤</div></div></div><div class="stats" style="margin-top:12px"><div class="stat"><b>'+state.user.points+'</b><span>Pontos</span></div><div class="stat"><b>'+state.user.games+'</b><span>Partidas</span></div><div class="stat"><b>'+state.user.wins+'</b><span>Vitórias</span></div></div><div class="card" style="margin-top:12px"><p class="section-title">HISTÓRICO</p>'+ (state.history.length?state.history.slice(0,8).map(h=>'<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>'+h.date+' · Ronda '+h.round+'</span><b>+'+h.score+'</b></div>').join(""):'<p class="muted">Ainda não tens partidas.</p>')+'</div>',"profile")}
function rank(){return shell('<div class="row"><div><p class="section-title">RANKING</p><h2 style="font-size:30px;margin:0">Os teus resultados</h2></div><span class="tag">PESSOAL</span></div><div class="card" style="margin-top:14px;text-align:center"><div style="font-size:44px">🏆</div><h2 style="margin:8px 0">'+esc(state.user.name)+'</h2><div class="stats" style="margin-top:14px"><div class="stat"><b>'+state.user.points+'</b><span>Pontos</span></div><div class="stat"><b>'+state.user.games+'</b><span>Partidas</span></div><div class="stat"><b>'+state.user.wins+'</b><span>Vitórias</span></div></div></div>',"rank")}
function render(){let s=state.screen;if(s==="home")document.getElementById("app").innerHTML=home();else if(s==="create")document.getElementById("app").innerHTML=create();else if(s==="lobby")document.getElementById("app").innerHTML=lobby();else if(s==="game")document.getElementById("app").innerHTML=game();else if(s==="verify")document.getElementById("app").innerHTML=verify();else if(s==="result")document.getElementById("app").innerHTML=resultScreen();else if(s==="profile")document.getElementById("app").innerHTML=profile();else if(s==="rank")document.getElementById("app").innerHTML=rank()}
window.go=go;window.toggleTheme=toggleTheme;window.toggleLetter=toggleLetter;window.toggleCat=toggleCat;window.makeRoom=makeRoom;window.shareRoom=shareRoom;window.startRound=startRound;window.finishRound=finishRound;window.result=result;window.nextRound=nextRound;window.join=join;window.addCustomCat=addCustomCat;window.changePlayers=changePlayers;window.changeRounds=changeRounds;
joinFromUrl();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body>
</html>
