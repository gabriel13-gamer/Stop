<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="description" content="STOP — Joga. Pensa. Para!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>STOP — Joga. Pensa. Para!</title>
<style>
:root{--bg:#0b0c0f;--panel:#15171c;--panel2:#1d2027;--text:#f5f5f2;--muted:#9ca1aa;--line:#2b2e36;--red:#e52d32;--red2:#b91920;--green:#37c878;--yellow:#e7b84b;--shadow:0 20px 60px rgba(0,0,0,.28);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#262a34 0,#0b0c0f 38%);color:var(--text);min-height:100vh}button,input{font:inherit}button{border:0}.app{width:min(100%,720px);margin:auto;min-height:100vh;padding:22px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:13px;background:#08090b;display:grid;place-items:center;box-shadow:0 8px 25px #0006}.mark svg{width:34px}.brand strong{font-size:19px;letter-spacing:.04em}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.iconbtn{width:42px;height:42px;border-radius:13px;background:var(--panel);color:var(--text);border:1px solid var(--line);cursor:pointer}.screen{margin-top:28px}.hero{text-align:center;padding:32px 12px 26px}.hero .mark{width:84px;height:84px;border-radius:25px;margin:auto}.hero .mark svg{width:64px}.hero h1{font-size:64px;line-height:.95;letter-spacing:-.05em;margin:20px 0 7px;font-weight:850}.hero p{margin:0;color:var(--muted)}.tag{display:inline-flex;padding:7px 10px;border:1px solid #ffffff12;background:#ffffff06;border-radius:999px;color:#c8cbd1;font-size:12px;margin-bottom:12px}.grid{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:linear-gradient(145deg,var(--panel),#111318);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.btn{width:100%;padding:15px 17px;border-radius:15px;background:var(--panel2);color:var(--text);font-weight:750;border:1px solid var(--line);cursor:pointer;transition:.18s transform,.18s filter}.btn:active{transform:scale(.985)}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.primary:hover{filter:brightness(1.08)}.btn.ghost{background:transparent}.btn.small{width:auto;padding:10px 13px}.stack{display:grid;gap:10px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:#777d87;margin:0 0 10px}.action{padding:20px;border-radius:22px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;color:var(--text)}.action.primary{background:linear-gradient(135deg,#ef353b,#a9151c);border-color:#f04b50}.action .big{font-size:27px;font-weight:850;letter-spacing:-.03em}.action p{margin:7px 0 0;color:#c1c5cb;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:13px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}.stat b{display:block;font-size:23px}.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(calc(100% - 28px),620px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;background:#121419eF;border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px);z-index:10}.nav button{background:transparent;color:#818792;padding:9px 3px;border-radius:16px;font-size:10px;cursor:pointer}.nav button.active{background:#24272e;color:#fff}.nav .ico{display:block;font-size:18px;margin-bottom:2px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.input{width:100%;background:#0e1014;border:1px solid var(--line);color:var(--text);padding:14px;border-radius:14px;outline:none}.input:focus{border-color:#e43a40}.label{font-size:12px;color:var(--muted);display:block;margin:0 0 7px}.letters{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.letter{padding:10px 0;border-radius:11px;background:#101217;border:1px solid var(--line);color:#aaa;cursor:pointer}.letter.on{background:#4d1519;border-color:#e52d32;color:#fff}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:9px 11px;border-radius:999px;background:#101217;border:1px solid var(--line);font-size:12px;color:#bfc3c9;cursor:pointer}.chip.on{background:#4d1519;border-color:#e52d32;color:#fff}.timer{font-size:50px;font-weight:900;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.timer.danger{color:#ff5157}.roundletter{width:112px;height:112px;border-radius:32px;background:linear-gradient(145deg,#ed353b,#99151c);display:grid;place-items:center;font-size:68px;font-weight:950;box-shadow:0 20px 50px #e52d3233}.answer{display:grid;grid-template-columns:1fr;gap:8px;margin-top:9px}.answer label{font-size:11px;color:#858b95}.verify{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.badge{font-size:11px;padding:6px 8px;border-radius:999px}.ok{background:#123b27;color:#68e09a}.bad{background:#431719;color:#ff8589}.pending{background:#49380f;color:#ffd66d}.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px}.place{padding:14px 8px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:18px}.place.first{padding-top:30px}.place b{display:block;font-size:25px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:11px 15px;border-radius:13px;background:#f3f3ef;color:#111;box-shadow:var(--shadow);z-index:20;font-size:13px;font-weight:700}.hide{display:none!important}@media(max-width:420px){.hero h1{font-size:54px}.grid2{grid-template-columns:1fr}.letters{grid-template-columns:repeat(6,1fr)}.roundletter{width:96px;height:96px;font-size:58px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="stop-static-v1";
const CATS=["Nome","Apelido","Animal","País","Cidade","Comida","Bebida","Profissão","Objeto","Marca","Filme","Série","Jogo","Personagem","Desporto","Clube","Planta","Tecnologia","Aplicação","Veículo"];
const ALPHA="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const WORDS={
Nome:{A:"Ana",B:"Bruno",C:"Carla",D:"Daniel",M:"Miguel",P:"Pedro",R:"Rita",S:"Sofia",T:"Tiago"},
Animal:{A:"Abelha",B:"Baleia",C:"Cão",D:"Doninha",M:"Macaco",P:"Panda",R:"Rato",S:"Sapo",T:"Tigre"},
País:{A:"Alemanha",B:"Brasil",C:"Canadá",D:"Dinamarca",M:"México",P:"Portugal",R:"Roménia",S:"Suécia",T:"Turquia"},
Cidade:{A:"Aveiro",B:"Braga",C:"Coimbra",D:"Dublin",M:"Maia",P:"Porto",R:"Roma",S:"Sintra",T:"Tomar"},
Comida:{A:"Arroz",B:"Bacalhau",C:"Cozido",D:"Donut",M:"Massa",P:"Pizza",R:"Ravioli",S:"Sopa",T:"Tosta"},
Profissão:{A:"Arquiteto",B:"Bombeiro",C:"Cozinheiro",D:"Dentista",M:"Médico",P:"Professor",R:"Repórter",S:"Soldado",T:"Técnico"},
Objeto:{A:"Agenda",B:"Bola",C:"Caneta",D:"Dado",M:"Mesa",P:"Porta",R:"Régua",S:"Sapato",T:"Tesoura"}
};
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{user:{name:"Gabriel",wins:0,games:0,points:0},screen:"home",theme:"dark",cats:CATS.slice(0,8),letters:["A","B","C","D","M","P","R","S","T"],seconds:60,rounds:5,room:null,round:0,letter:"M",answers:{},history:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function mark(){return '<div class="mark"><svg viewBox="0 0 32 32"><path fill="#e52d32" d="M16 3.4 24.4 6.9 28.6 16 24.4 25.1 16 28.6 7.6 25.1 3.4 16 7.6 6.9Z"/><path fill="#fff" d="M11.2 12.1c0-2.1 2.1-3.4 4.9-3.4 2.9 0 4.8 1.4 4.8 3.4 0 1.7-1.1 2.6-3.6 3.4l-2.1.7c-1.1.4-1.5.9-1.5 1.7 0 1.1 1.1 1.8 2.9 1.8 2.1 0 3.1-.9 3.3-2.3h2.1c-.3 2.5-2.4 4.1-5.4 4.1-3 0-5-1.7-5-3.9 0-1.8 1.1-2.8 3.6-3.6l2.1-.7c1.2-.4 1.6-.9 1.6-1.5 0-1-.9-1.6-2.6-1.6-1.7 0-2.7.6-2.8 1.9h-2.3z"/></svg></div>'}
function header(){return '<header class="top"><div class="brand">'+mark()+'<div><strong>STOP</strong><small>Joga. Pensa. Para!</small></div></div><button class="iconbtn" onclick="toggleTheme()">☾</button></header>'}
function nav(active){return '<nav class="nav">'+[['home','⌂','Início'],['play','🎮','Jogar'],['rank','🏆','Ranking'],['profile','●','Perfil']].map(x=>'<button class="'+(active===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')"><span class="ico">'+x[1]+'</span>'+x[2]+'</button>').join("")+'</nav>'}
function shell(body,active="home"){return '<div class="app">'+header()+'<main class="screen">'+body+'</main>'+nav(active)+'</div>'}
function go(s){state.screen=s;save();render()}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function toggleTheme(){state.theme=state.theme==="dark"?"light":"dark";document.documentElement.style.setProperty("--bg",state.theme==="dark"?"#0b0c0f":"#f2f1ed");document.body.style.background=state.theme==="dark"?"radial-gradient(circle at 50% -10%,#262a34 0,#0b0c0f 38%)":"#f2f1ed";document.body.style.color=state.theme==="dark"?"#f5f5f2":"#151515";toast(state.theme==="dark"?"Modo escuro":"Modo claro");save()}
function home(){return shell('<section class="hero"><span class="tag">PARTIDAS RÁPIDAS • STOP ONLINE READY</span>'+mark()+'<h1>STOP</h1><p>Joga. Pensa. Para!</p></section><div class="grid"><button class="action primary" onclick="go(\'create\')"><div class="big">Criar partida</div><p>Escolhe categorias, letras, tempo e rondas.</p></button><button class="action" onclick="join()"><div class="big">Entrar numa partida</div><p>Usa um código de sala para jogar com amigos.</p></button><div class="grid grid2"><button class="action" onclick="go(\'profile\')"><div class="big" style="font-size:20px">Perfil</div><p>Estatísticas e histórico.</p></button><button class="action" onclick="go(\'rank\')"><div class="big" style="font-size:20px">Ranking</div><p>Compara pontuações.</p></button></div></div>')}
function create(){return shell('<div class="row"><div><p class="section-title">CONFIGURAÇÃO</p><h2 style="font-size:30px;margin:0">Criar partida</h2></div><span class="tag">HOST</span></div><div class="grid" style="margin-top:18px"><div class="card"><label class="label">Número de rondas</label><div class="row"><input class="input" id="rounds" type="number" min="1" max="20" value="'+state.rounds+'"><span class="tiny">1–20</span></div></div><div class="card"><label class="label">Tempo por ronda</label><div class="grid grid2">'+[15,30,45,60,90,120].map(n=>'<button class="chip '+(state.seconds===n?'on':'')+'" onclick="state.seconds='+n+';save();render()">'+n+'s</button>').join("")+'</div></div><div class="card"><label class="label">Letras disponíveis</label><div class="letters">'+ALPHA.map(l=>'<button class="letter '+(state.letters.includes(l)?'on':'')+'" onclick="toggleLetter(\''+l+'\')">'+l+'</button>').join("")+'</div><div class="row" style="margin-top:10px"><button class="btn small ghost" onclick="state.letters=ALPHA.slice();save();render()">Selecionar todas</button><button class="btn small ghost" onclick="state.letters=[];save();render()">Limpar</button></div></div><div class="card"><label class="label">Categorias — mínimo 8</label><div class="chips">'+CATS.map(c=>'<button class="chip '+(state.cats.includes(c)?'on':'')+'" onclick="toggleCat(\''+c+'\')">'+c+'</button>').join("")+'</div><p class="tiny" style="margin:12px 0 0">'+state.cats.length+' selecionadas</p></div><button class="btn primary" onclick="makeRoom()">Criar sala</button></div>',"play")}
function toggleLetter(l){state.letters=state.letters.includes(l)?state.letters.filter(x=>x!==l):[...state.letters,l];save();render()}
function toggleCat(c){state.cats=state.cats.includes(c)?state.cats.filter(x=>x!==c):[...state.cats,c];save();render()}
function makeRoom(){const r=String(Math.random()).slice(2,8).toUpperCase();state.rounds=Math.max(1,Math.min(20,+document.getElementById("rounds").value||5));if(state.cats.length<8)return toast("Escolhe pelo menos 8 categorias");if(!state.letters.length)return toast("Escolhe pelo menos uma letra");state.room=r;state.screen="lobby";save();render()}
function lobby(){return shell('<div class="card" style="text-align:center;padding:28px"><p class="section-title">SALA</p><h1 style="font-size:52px;letter-spacing:.08em;margin:5px 0 10px">'+state.room+'</h1><p class="muted">Partilha este código com os teus amigos.</p><div class="grid grid2" style="margin-top:18px"><button class="btn" onclick="navigator.clipboard?.writeText(state.room);toast(\'Código copiado\')">Copiar código</button><button class="btn" onclick="shareRoom()">Partilhar</button></div></div><div class="card" style="margin-top:12px"><div class="row"><b>Jogadores</b><span class="badge ok">● 2 online</span></div><div style="margin-top:14px;display:grid;gap:10px"><div class="row"><span>👤 '+esc(state.user.name)+'</span><span class="tiny">HOST</span></div><div class="row"><span>🤖 Joana</span><span class="tiny">BOT</span></div></div></div><button class="btn primary" style="margin-top:12px" onclick="startRound()">COMEÇAR PARTIDA</button><button class="btn ghost" style="margin-top:6px" onclick="go(\'home\')">Sair da sala</button>',"play")}
function shareRoom(){const url=location.href.split("#")[0]+"#join="+state.room;if(navigator.share)navigator.share({title:"STOP",text:"Entra na minha partida de STOP!",url});else{navigator.clipboard?.writeText(url);toast("Link copiado")}}
function startRound(){state.round=1;state.letter=state.letters[Math.floor(Math.random()*state.letters.length)];state.answers={};state.screen="game";save();render();startTimer()}
let timer=null,endAt=0;
function startTimer(){clearInterval(timer);endAt=Date.now()+state.seconds*1000;timer=setInterval(()=>{if(Date.now()>=endAt){clearInterval(timer);finishRound(true)}else{const el=document.getElementById("timer");if(el){const left=Math.ceil((endAt-Date.now())/1000);el.textContent=left;el.classList.toggle("danger",left<=10)}}},250)}
function game(){const fields=state.cats.map(c=>'<div class="answer"><label>'+c+'</label><input class="input" data-cat="'+esc(c)+'" value="'+esc(state.answers[c]||"")+'" placeholder="Resposta..."></div>').join("");return shell('<div class="row"><div><p class="section-title">RONDA '+state.round+'/'+state.rounds+'</p><div id="timer" class="timer">'+state.seconds+'</div></div><div class="roundletter">'+state.letter+'</div></div><div class="card" style="margin-top:18px"><div class="row"><b>As tuas respostas</b><span class="tiny">'+state.cats.length+' categorias</span></div>'+fields+'</div><button class="btn primary" style="margin-top:12px;font-size:18px" onclick="finishRound(false)">🛑 STOP!</button><p class="tiny" style="text-align:center;margin-top:10px">Qualquer jogador pode terminar a ronda.</p>',"play")}
function finishRound(auto){clearInterval(timer);document.querySelectorAll("[data-cat]").forEach(i=>state.answers[i.dataset.cat]=i.value.trim());state.screen="verify";state.auto=auto;save();render()}
function verify(){const rows=state.cats.map(c=>{const a=state.answers[c]||"";const good=a.toUpperCase().startsWith(state.letter)&&a.length>0;return '<div class="verify"><div><b>'+c+'</b><div class="tiny">'+(a?esc(a):"Sem resposta")+'</div></div><span class="badge '+(good?"ok":"bad")+'">'+(good?"✓ +10":"✕ 0")+'</span></div>'}).join("");return shell('<div class="card"><p class="section-title">VERIFICAÇÃO</p><h2 style="font-size:30px;margin:0 0 8px">Respostas da ronda</h2><p class="muted">'+(state.auto?"⏱️ Tempo esgotado — STOP automático.":"🛑 STOP feito manualmente.")+'</p>'+rows+'</div><button class="btn primary" style="margin-top:12px" onclick="result()">Ver resultado</button>',"play")}
function result(){let score=state.cats.reduce((n,c)=>n+((state.answers[c]||"").toUpperCase().startsWith(state.letter)?10:0),0);state.user.points+=score;state.user.games++;if(state.round===state.rounds)state.user.wins++;state.history.unshift({date:new Date().toLocaleDateString("pt-PT"),round:state.round,score,letter:state.letter});state.history=state.history.slice(0,20);save();state.screen="result";state.lastScore=score;render()}
function resultScreen(){return shell('<div class="card" style="text-align:center"><div style="font-size:42px">🏆</div><p class="section-title">RONDA TERMINADA</p><h1 style="font-size:40px;margin:0">+'+state.lastScore+' pontos</h1><p class="muted">Letra: <b>'+state.letter+'</b></p></div><div class="podium" style="margin-top:12px"><div class="place"><span>🥈</span><b>Joana</b><small>50 pts</small></div><div class="place first"><span>🥇</span><b>'+esc(state.user.name)+'</b><small>'+state.lastScore+' pts</small></div><div class="place"><span>🥉</span><b>Miguel</b><small>40 pts</small></div></div><button class="btn primary" style="margin-top:14px" onclick="nextRound()">'+(state.round<state.rounds?"Próxima ronda":"🏆 Resultado final")+'</button>',"play")}
function nextRound(){if(state.round>=state.rounds){go("home");toast("Partida terminada!");return}state.round++;state.letter=state.letters[Math.floor(Math.random()*state.letters.length)];state.answers={};state.screen="game";save();render();startTimer()}
function join(){const code=prompt("Código da sala:");if(code){state.room=code.toUpperCase();state.screen="lobby";save();render()}}
function profile(){return shell('<div class="card"><p class="section-title">PERFIL</p><div class="row"><div><h2 style="margin:0;font-size:30px">'+esc(state.user.name)+'</h2><p class="muted">Jogador STOP</p></div><div style="font-size:44px">👤</div></div></div><div class="stats" style="margin-top:12px"><div class="stat"><b>'+state.user.points+'</b><span>Pontos</span></div><div class="stat"><b>'+state.user.games+'</b><span>Partidas</span></div><div class="stat"><b>'+state.user.wins+'</b><span>Vitórias</span></div></div><div class="card" style="margin-top:12px"><p class="section-title">HISTÓRICO</p>'+ (state.history.length?state.history.slice(0,8).map(h=>'<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>'+h.date+' · Ronda '+h.round+'</span><b>+'+h.score+'</b></div>').join(""):'<p class="muted">Ainda não tens partidas.</p>')+'</div>',"profile")}
function rank(){const arr=[{n:state.user.name,p:state.user.points},{n:"Joana",p:620},{n:"Miguel",p:540},{n:"Sofia",p:480}].sort((a,b)=>b.p-a.p);return shell('<div class="row"><div><p class="section-title">RANKING</p><h2 style="font-size:30px;margin:0">Global</h2></div><span class="tag">TOP</span></div><div class="grid" style="margin-top:14px">'+arr.map((x,i)=>'<div class="card row"><div><span style="font-size:22px">'+(i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1))+'</span> <b>'+esc(x.n)+'</b></div><b>'+x.p+' pts</b></div>').join("")+'</div>',"rank")}
function render(){let s=state.screen;if(s==="home")document.getElementById("app").innerHTML=home();else if(s==="create")document.getElementById("app").innerHTML=create();else if(s==="lobby")document.getElementById("app").innerHTML=lobby();else if(s==="game")document.getElementById("app").innerHTML=game();else if(s==="verify")document.getElementById("app").innerHTML=verify();else if(s==="result")document.getElementById("app").innerHTML=resultScreen();else if(s==="profile")document.getElementById("app").innerHTML=profile();else if(s==="rank")document.getElementById("app").innerHTML=rank()}
window.go=go;window.toggleTheme=toggleTheme;window.toggleLetter=toggleLetter;window.toggleCat=toggleCat;window.makeRoom=makeRoom;window.shareRoom=shareRoom;window.startRound=startRound;window.finishRound=finishRound;window.result=result;window.nextRound=nextRound;window.join=join;
if(location.hash.startsWith("#join=")){state.room=location.hash.slice(6).toUpperCase();state.screen="lobby";save();history.replaceState(null,"",location.pathname)}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body>
</html>
